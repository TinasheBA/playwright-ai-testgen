name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run eval unit tests
        run: npm test
      - name: Dry-run eval pipeline (good mock)
        run: npm run dry-run:good
      - name: Dry-run eval pipeline (bad mock — should fail)
        run: npm run dry-run:bad || true
